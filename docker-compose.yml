# Postgres untuk pengembangan lokal. Produksi memakai Supabase.
# Jalankan: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: sobadi-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: astoria
      POSTGRES_PASSWORD: astoria
      POSTGRES_DB: astoria
    ports:
      - "5432:5432"
    volumes:
      - sobadi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astoria -d astoria"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sobadi_pgdata:
