name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Nilai dummy: CI tidak menyentuh database atau layanan AI produksi.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/sobadi_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/sobadi_ci
      TEST_DATABASE_URL: postgresql://astoria:astoria@localhost:5432/astoria_test
      NEXTAUTH_SECRET: ci-only-secret
      NEXTAUTH_URL: http://localhost:3000
      AI_BASE_URL: https://example.invalid/v1
      AI_API_KEY: ""
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astoria
          POSTGRES_PASSWORD: astoria
          POSTGRES_DB: astoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astoria -d astoria_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit test + coverage
        run: bun run test:coverage

      - name: Integration test API + coverage
        run: bun run test:integration:coverage

      - name: Build
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E Playwright
        run: bun run test:e2e
